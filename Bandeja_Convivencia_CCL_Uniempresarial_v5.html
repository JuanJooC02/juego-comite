<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bandeja de Convivencia · CCL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: portada y menús en columna; el juego ocupa toda la pantalla (celular o computador) con una cámara que sigue al personaje. El mundo tiene colores fijos; la interfaz sigue el tema claro u oscuro del dispositivo. */
:root{
  --azul:#223D8A; --rojo:#E80A0A; --ok:#166534; --mal:#B91C1C; --info:#2B4C7E;
  --mesa:#F1F3F7; --papel:#FFFFFF; --tinta:#1E2536; --suave:#525D73; --linea:#DCE1EC;
  --chip:#F3F5F9; --acento-txt:#223D8A; --ok-bg:#EAF5EE; --mal-bg:#FBECEC; --info-bg:#EDF2FA; --oro:#855D10; --oro-bg:#FAF4E4;
  --hud:rgba(255,255,255,.82); --hud-tinta:#1E2536;
  --sombra:0 1px 3px rgba(15,23,42,.05),0 4px 12px rgba(15,23,42,.04);
  --f-disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-txt:"Inter",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-pix:"Pixelify Sans","JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --mesa:#111622; --papel:#1A2130; --tinta:#E6EAF2; --suave:#9AA5B8; --linea:#2A344A;
  --chip:#222B3D; --acento-txt:#9BB2F0; --ok:#4ADE80; --mal:#F87171; --info:#93B4E8; --ok-bg:#142E22; --mal-bg:#331A20; --info-bg:#1E2A42; --oro:#E2BE62; --oro-bg:#2E2614;
  --hud:rgba(20,26,38,.82); --hud-tinta:#E6EAF2; --sombra:0 1px 3px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --mesa:#111622; --papel:#1A2130; --tinta:#E6EAF2; --suave:#9AA5B8; --linea:#2A344A;
  --chip:#222B3D; --acento-txt:#9BB2F0; --ok:#4ADE80; --mal:#F87171; --info:#93B4E8; --ok-bg:#142E22; --mal-bg:#331A20; --info-bg:#1E2A42; --oro:#E2BE62; --oro-bg:#2E2614;
  --hud:rgba(20,26,38,.82); --hud-tinta:#E6EAF2; --sombra:0 1px 3px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--mesa);color:var(--tinta);font-family:var(--f-txt);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.jugando{overflow:hidden;overscroll-behavior:none}
body.jugando::before{background:#182030}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mesa)}
.app{max-width:620px;margin:0 auto;padding-block:12px 40px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--acento-txt);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:11px 16px;min-height:40px;font-weight:600;font-size:15px;background:var(--azul);color:#fff;width:100%}
.btn.sec{background:transparent;color:var(--acento-txt);border:1px solid var(--linea)}
.btn.rojo{background:var(--rojo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.marco{position:relative;background:var(--papel);border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra);padding:16px;overflow:hidden}
.marco::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--azul) 72%,var(--rojo) 72%)}
.eti{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.nota{font-size:13px;color:var(--suave);margin:0}
/* Portada · Diseño Tarjeta Dividida CCL */
.portada{display:flex;flex-direction:column;gap:14px}
.ccl-banner{position:relative;border-radius:18px;overflow:hidden;background:var(--papel);color:var(--tinta);box-shadow:var(--sombra);border:1px solid var(--linea)}
.ccl-banner::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--azul) 72%,var(--rojo) 72%);z-index:2}
.ccl-banner-grid{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:540px){.ccl-banner-grid{grid-template-columns:1.12fr .88fr;align-items:stretch}}
.ccl-banner-info{padding:16px 16px 15px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.ccl-banner-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ccl-banner-top img{width:88px;height:auto;background:#fff;border-radius:8px;padding:3px 5px;border:1px solid var(--linea)}
.ccl-pill{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acento-txt);background:var(--info-bg);border:1px solid var(--linea);padding:4px 9px;border-radius:999px;white-space:nowrap}
.ccl-tit small{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--rojo);display:block;margin-bottom:4px}
.ccl-tit h1{font-family:var(--f-disp);font-size:clamp(23px,5.5vw,30px);font-weight:800;line-height:1.1;color:var(--tinta);margin:0 0 6px}
.ccl-tit p{margin:0;font-size:13px;line-height:1.42;color:var(--suave)}
.ccl-escena-wrap{position:relative;background:linear-gradient(160deg,#15244B 0%,#223D8A 100%);display:flex;flex-direction:column;justify-content:flex-end;min-height:195px;overflow:hidden}
.ccl-escena-wrap canvas{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
.ccl-escena-tag{position:absolute;bottom:8px;left:8px;right:8px;background:rgba(15,23,42,.82);backdrop-filter:blur(4px);color:#F8FAFC;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 8px;font-size:11px;line-height:1.25;display:flex;align-items:center;justify-content:space-between;gap:6px}
.ccl-escena-tag b{font-family:var(--f-txt);font-weight:700;color:#93C5FD;display:block}
.ccl-escena-tag span{font-family:var(--f-mono);font-size:10px;opacity:.85}
.hero{position:relative;border-radius:16px;overflow:hidden;background:#1E2942;line-height:0;box-shadow:var(--sombra);border:1px solid var(--linea)}
.hero canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.logo{width:clamp(60px,17vw,110px);height:auto;background:#fff;border-radius:10px;padding:4px;position:absolute;top:8px;left:8px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ccl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ccl-stat{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:10px 10px 9px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:4px}
.ccl-stat span{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave)}
.ccl-stat b{font-family:var(--f-disp);font-size:19px;font-weight:800;color:var(--acento-txt);line-height:1}
.prog{display:flex;gap:10px;align-items:center;font-size:13.5px}
.barrita{height:5px;border-radius:8px;background:var(--linea);overflow:hidden;margin-top:2px}
.barrita i{display:block;height:100%;background:linear-gradient(90deg,var(--azul),#3B82F6)}
.ccl-dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ccl-dock button{border:1px solid var(--linea);background:var(--papel);border-radius:12px;padding:10px 8px;font-size:12.5px;font-weight:600;color:var(--tinta);box-shadow:var(--sombra);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ccl-dock button i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--acento-txt);background:var(--chip);padding:2px 7px;border-radius:6px}
.misiones{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:520px){.misiones{grid-template-columns:1fr 1fr}.misiones .mis:last-child:nth-child(odd){grid-column:1/-1}}
.mis{display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--linea);border-top:3px solid var(--azul);background:var(--papel);border-radius:13px;padding:12px 13px;box-shadow:var(--sombra);transition:transform .12s,border-color .12s}
.mis:hover{transform:translateY(-1px);border-color:var(--azul)}
.mis.ok{border-top-color:var(--ok)}
.mis-head{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%}
.mis .n{font-family:var(--f-mono);font-weight:700;color:var(--acento-txt);background:var(--chip);border-radius:6px;padding:2px 7px;font-size:11px}
.mis b{display:block;font-size:14.5px;line-height:1.25}
.mis small{color:var(--suave);font-size:12px;display:block;margin-top:2px}
.mis .st{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:2px 7px;border-radius:999px;white-space:nowrap}
.mis .st.no{color:var(--suave);background:var(--chip);font-weight:600}
/* Personaje */
.estudio{display:grid;gap:12px}
.preview{background:linear-gradient(#EFF2F8,#E4E9F2);border:1px solid var(--linea);border-radius:14px;display:flex;justify-content:center;gap:4px;padding:10px;line-height:0}
.preview canvas{width:23%;max-width:110px;height:auto;image-rendering:pixelated}
.opcion{display:grid;gap:6px}
.opcion > span{font-weight:600;font-size:14px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--linea)}
.sw button.nada{background:repeating-linear-gradient(45deg,var(--papel) 0 5px,var(--linea) 5px 7px)}
.sw button[aria-pressed="true"]{outline:2.5px solid var(--azul);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--linea);background:var(--papel);border-radius:999px;padding:6px 12px;min-height:34px;font-size:13.5px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
.campo input{width:100%;box-sizing:border-box;border:1px solid var(--linea);background:var(--papel);color:var(--tinta);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
/* Juego a pantalla completa */
.juego{position:fixed;inset:0;z-index:8;background:#182030;display:flex;flex-direction:column}
.juego canvas.mundo{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;image-rendering:pixelated}
.hud{position:absolute;z-index:2;left:0;right:0;display:flex;gap:6px;align-items:center;justify-content:space-between;pointer-events:none;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.hud.arriba{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
.hud.abajo{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);justify-content:center}
.hud > *{pointer-events:auto}
.chipo{background:var(--hud);color:var(--hud-tinta);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--linea);border-radius:10px;padding:4px 9px;box-shadow:0 1px 4px rgba(15,23,42,.12);font-size:12px;line-height:1.2;min-width:0}
.chipo b{font-family:var(--f-pix);font-size:16px;display:block}
.chipo.cap{flex:0 1 auto;max-width:min(62%,360px);overflow:hidden}
.chipo.cap span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--hud);color:var(--hud-tinta);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--linea);border-radius:10px;padding:6px 8px;min-height:38px;box-shadow:0 1px 4px rgba(15,23,42,.14);font-weight:600;font-size:11.5px;display:grid;justify-items:center;align-content:center;gap:1px;min-width:52px}
.hb i{font-style:normal;font-family:var(--f-pix);font-size:15px;line-height:1}
.hb.prim{background:var(--azul);color:#fff;border-color:var(--azul)}
.botonera{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;width:min(100%,500px)}
.botonera .hb{min-width:0;padding:5px 2px;font-size:11px;min-height:44px}
.aviso{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 58px);width:min(90%,400px);box-sizing:border-box;
  background:rgba(24,32,48,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#F8FAFC;font-family:var(--f-txt);font-weight:500;font-size:12.5px;line-height:1.25;padding:5px 10px;border-radius:8px;pointer-events:none;border:1px solid rgba(255,255,255,.16);text-align:center}
.aviso.arriba{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 88px)}
body.velo-abierto .hud,body.velo-abierto .hud > *,body.velo-abierto .aviso{opacity:0;pointer-events:none}
.zoom{display:grid;gap:4px}
.zoom .hb{min-width:40px;width:40px;height:40px;min-height:40px;padding:0;border-radius:8px;place-items:center}
.zoom .hb i{font-size:15px}
/* Hojas emergentes */
.velo{position:fixed;inset:0;z-index:20;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px))}
.hoja{background:var(--papel);width:100%;max-width:600px;max-height:92vh;max-height:min(92%,calc(100dvh - 12px));overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-radius:16px 16px 0 0;border:1px solid var(--linea);box-shadow:0 -4px 20px rgba(15,23,42,.12);padding:14px 16px 18px;position:relative;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.hoja > *{flex-shrink:0}
.hoja h2{font-size:19px;padding-right:72px;line-height:1.2}
.cab-sala{display:flex;flex-direction:column;gap:2px;padding-right:72px}
.cab-sala .eti{display:inline-flex;align-items:center;gap:6px}
.cab-sala .eti i{width:8px;height:8px;border-radius:99px;display:inline-block}
.cab-sala h2{padding-right:0}
.cerrar{position:absolute;top:12px;right:12px}
.mini{border:1px solid var(--linea);background:var(--chip);color:var(--tinta);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600;font-size:13px}
.interior{width:100%;aspect-ratio:16/7;height:auto;border-radius:10px;border:1px solid var(--linea);image-rendering:pixelated;display:block;background:#EAECEF}
.npc{display:flex;gap:10px;align-items:center}
.npc canvas{flex:none;width:48px;height:48px;border-radius:10px;border:1px solid var(--linea);background:var(--chip);image-rendering:pixelated}
.globo{background:var(--chip);border:1px solid var(--linea);border-radius:4px 12px 12px 12px;padding:8px 11px;font-size:13.5px;line-height:1.4;flex:1;min-width:0}
.globo b.quien{display:block;font-family:var(--f-txt);font-weight:700;font-size:12.5px;color:var(--acento-txt);margin-bottom:2px}
.dialogo .globo{font-size:14.5px}
.dialogo canvas{width:72px;height:72px}
.pedidos{display:grid;gap:6px}
.ped{text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:10px;padding:9px 12px;min-height:40px;font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:10px;align-items:center;transition:border-color .15s,background .15s}
.ped small{color:var(--acento-txt);background:var(--chip);border:1px solid var(--acento-txt);border-radius:6px;padding:2px 7px;font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.ped.hecho{border-color:var(--ok);background:var(--ok-bg)}
.ped.hecho small{background:var(--papel);color:var(--ok);border-color:var(--ok)}
.ped.accion{border-color:var(--info);background:var(--info-bg)}
.ped.accion small{background:var(--papel);color:var(--acento-txt);border-color:var(--acento-txt)}
.res{padding:9px 12px;border-radius:10px;font-size:13.5px;border:1px solid var(--linea)}
.res.bien{background:var(--ok-bg);border-color:var(--ok)} .res.malo{background:var(--mal-bg);border-color:var(--mal)} .res.info{background:var(--info-bg);border-color:var(--linea)}
.res b{display:block;margin-bottom:2px}
.cita{display:block;margin-top:4px;font-family:var(--f-mono);font-size:11px;color:var(--suave)}
.caso .cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.canal{font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--info-bg);color:var(--acento-txt);border-radius:999px;padding:3px 9px}
.de{color:var(--suave);font-size:13px}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:13.5px}
.ficha dt{color:var(--suave)} .ficha dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.carpeta{display:flex;flex-wrap:wrap;gap:6px}
.carpeta span{font-size:12.5px;background:var(--ok-bg);border:1px solid var(--ok);border-radius:999px;padding:3px 9px}
.carpeta em{font-size:13px;color:var(--suave)}
.oficinas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.oficinas button{min-width:0;overflow-wrap:anywhere;border:1px solid var(--linea);background:var(--papel);border-radius:10px;padding:10px 8px;min-height:44px;font-size:13px;font-weight:600;line-height:1.2;display:grid;gap:6px;justify-items:start;text-align:left}
.oficinas i{width:100%;height:5px;border-radius:3px}
.docs{display:grid;gap:8px}
.doc{border:1px solid var(--linea);border-radius:10px;padding:10px 12px;display:grid;gap:7px}
.doc .n{font-weight:600} .doc .d{font-size:13px;color:var(--suave)}
.doc .acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc .acc button{border:1px solid var(--linea);background:var(--papel);border-radius:8px;padding:8px;min-height:36px;font-weight:600;font-size:13.5px}
.doc .acc button[aria-pressed="true"].si{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.doc .acc button[aria-pressed="true"].no{background:var(--mal-bg);border-color:var(--mal);color:var(--mal)}
.doc.bien{border-color:var(--ok)} .doc.malo{border-color:var(--mal)}
.formato{border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.formato .enc{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 12px;background:var(--chip);font-size:13px}
.formato .enc b{font-family:var(--f-disp);font-size:15px}
.formato .enc span{font-family:var(--f-mono);font-size:11px;text-align:right;color:var(--suave)}
.fila{display:grid;gap:4px;padding:10px 12px;border-top:1px solid var(--linea)}
.fila .lab{font-size:11.5px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.fila .q{font-size:13.5px;color:var(--suave)}
.fila button.val{text-align:left;border:1px dashed var(--linea);background:var(--papel);border-radius:8px;padding:9px 10px;min-height:38px;font-size:14px}
.fila button.val.lleno{border-style:solid;border-color:var(--info);background:var(--info-bg)}
.fila.bien button.val{border-color:var(--ok);background:var(--ok-bg)}
.fila.malo button.val{border-color:var(--mal);background:var(--mal-bg)}
.tipos{display:grid;gap:8px}
.tipo{text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:10px;padding:11px 12px;min-height:42px;display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.tipo b{font-family:var(--f-mono);color:var(--acento-txt);font-size:13px}
.sello{align-self:flex-start;font-family:var(--f-mono);font-weight:700;font-size:22px;letter-spacing:.08em;padding:4px 12px;border:3px solid currentColor;border-radius:8px;transform:rotate(-5deg);margin:4px 0;animation:golpe .35s cubic-bezier(.2,1.6,.4,1)}
.sello.ok{color:var(--ok)} .sello.mal{color:var(--mal)}
@keyframes golpe{from{transform:rotate(-5deg) scale(2.2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.lista{list-style:none;padding:0;margin:0;display:grid;gap:7px;font-size:14px}
.lista li{display:grid;grid-template-columns:20px 1fr;gap:8px}
.lista .m{font-family:var(--f-mono);font-weight:700} .lista .m.ok{color:var(--ok)} .lista .m.no{color:var(--mal)}
.pagina{background:var(--oro-bg);border:1px solid var(--oro);border-radius:12px;padding:12px;display:grid;gap:6px}
.pagina .art{font-family:var(--f-pix);font-size:26px;font-weight:700;color:var(--oro);line-height:1}
.pagina h3{font-size:17px}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.carta{aspect-ratio:3/4;border-radius:10px;border:1px dashed var(--linea);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;text-align:center;font-size:11px;line-height:1.15;color:var(--suave);background:var(--papel)}
.carta b{font-family:var(--f-pix);font-size:18px;color:var(--suave)}
.carta.ok{border:1px solid var(--oro);background:var(--oro-bg);color:var(--tinta)}
.carta.ok b{color:var(--oro)}
.manual h3{font-size:16px;margin:8px 0 2px}
.manual table{width:100%;border-collapse:collapse;font-size:13px}
.manual td{border-top:1px solid var(--linea);padding:6px 4px;vertical-align:top}
.manual td:first-child{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.manual ul{margin:0;padding-left:18px;font-size:14px}
.rank{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px;counter-reset:r}
.rank li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--chip);font-size:14px;counter-increment:r}
.rank li::before{content:counter(r);font-family:var(--f-mono);font-weight:700;color:var(--acento-txt)}
.rank li.yo{outline:1.5px solid var(--azul)}
.rank li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.estrellas{font-size:18px;color:var(--oro);letter-spacing:2px}
@media (max-width:380px){.oficinas{grid-template-columns:repeat(2,minmax(0,1fr))}.album{grid-template-columns:repeat(3,minmax(0,1fr))}.manual td:first-child{white-space:normal}.botonera .hb{font-size:10px;padding:4px 1px}}
@media (min-width:900px){.hb{min-width:64px;font-size:12.5px}.chipo{font-size:13px}}
.hoja{animation:sube .2s ease-out}
@keyframes sube{from{transform:translateY(22px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sello,.hoja{animation:none}}
</style>

  if(!pisable(b[0],b[1]))return null;
  const k=p=>p[0]+","+p[1],prev={},q=[a];prev[k(a)]=null;
  while(q.length){const c=q.shift();if(c[0]===b[0]&&c[1]===b[1])break;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[c[0]+d[0],c[1]+d[1]];if(pisable(n[0],n[1])&&!(k(n) in prev)){prev[k(n)]=c;q.push(n)}}}

}

  h.querySelector("#firmar").onclick=()=>{hojaActual.fijo=true;let err=0;
    m.campos.forEach((c,i)=>{const ok=!!c.o[resp[i]][1],f=h.querySelector("#f"+i);f.classList.add(ok?"bien":"malo");f.querySelector(".val").disabled=true;
      f.append(el(`<div class="res ${ok?"bien":"malo"}" style="margin-top:4px">${ok?"":`<b>Correcto: ${esc(c.o.find(o=>o[1])[0])}</b>`}${esc(c.p)}<span class="cita">${esc(c.c)}</span></div>`));
      if(ok){sumar(100);S.campOk++}else{err++;sumar(-50);S.log.push([0,c.k+": "+c.q,c.p,c.c])}});
    S.formErr=err;const fb=h.querySelector("#firmar");fb.textContent="Ver el concepto del Comité";fb.onclick=resultado;fb.scrollIntoView({block:"nearest"})};
}
function maxPts(m){return 50*Object.keys(m.necesita).filter(k=>k!=="docs").length+25*m.docs.length+100*m.campos.length+200}
function estrellas(i){const p=S.best[i];if(p==null)return 0;const r=p/maxPts(MIS[i]);return r>=.9?3:r>=.65?2:1}
function resultado(){
  const m=MIS[S.m];const limpio=!S.devol&&!S.formErr&&S.ayudas<2&&!S.log.some(l=>!l[0])&&!Object.keys(S.pedidos).length;if(limpio){sumar(200);SFX.sello()}
  const pts=Math.max(0,S.pts),prev=S.best[S.m];if(prev==null||pts>prev){S.best[S.m]=pts;guardar("ccl_best",JSON.stringify(S.best))}
  const errores=S.log.filter(l=>!l[0]);
  const h=hoja(`<span class="eti">Revisión del Comité · ${FORMATOS[m.formato].c}</span>
    <span class="sello ${limpio?"ok":"mal"}">${limpio?"RADICADO":"CON OBSERVACIONES"}</span>
    <h2>${pts} puntos${limpio?" (incluye +200 por radicar limpio)":""}</h2><span class="estrellas">${"★".repeat(estrellas(S.m))}${"☆".repeat(3-estrellas(S.m))}</span>
    <p class="nota">Devoluciones: ${S.devol} · Campos bien: ${S.campOk} de ${m.campos.length} · Pistas: ${S.ayudas}</p>
    <div class="npc">${retratoHTML("C")}<div class="globo"><b class="quien">Alexandra Neira · Presidenta CCL</b>${esc(m.leccion)}</div></div>
    ${errores.length?`<span class="eti">Para repasar</span><ul class="lista">${errores.map(e=>`<li><span class="m no">✗</span><span><b>${esc(e[1])}.</b> ${esc(e[2])}${e[3]?`<span class="cita">${esc(e[3])}</span>`:""}</span></li>`).join("")}</ul>`:""}
    <span class="eti">La ruta correcta</span>
    <ul class="lista">${Object.keys(m.necesita).map(id=>`<li><span class="m ok">✓</span><span><b>${esc(SALAS[ITEMS[id].sala].corto)}:</b> ${esc(ITEMS[id].n)}</span></li>`).join("")}<li><span class="m ok">✓</span><span><b>${esc(SALAS[m.destino].corto)}:</b> radicar el ${FORMATOS[m.formato].c}</span></li></ul>
    <div style="display:grid;gap:8px">${S.m+1<MIS.length?`<button class="btn" id="sig">Siguiente capítulo</button>`:""}<button class="btn sec" id="men">Volver al inicio</button></div>`,portada);
  const sg=h.querySelector("#sig");if(sg)sg.onclick=()=>{cerrarHoja(true);salirDelJuego();iniciar(S.m+1)};
  h.querySelector("#men").onclick=()=>cerrarHoja();
  publicar();
}

/* ---------- Final: auditoría ---------- */
function auditoria(){
  const nh=Object.keys(S.hojas).length,est=MIS.reduce((a,_,i)=>a+estrellas(i),0);
  const nota=est>=13&&nh===HOJAS.length?"Impecable. Las cinco carpetas están completas y el manual volvió entero. El cierre institucional no tiene observaciones.":est>=10?"Buen trabajo. Hay detalles por pulir en algunos expedientes, pero el debido proceso se sostiene.":"Los expedientes llegaron, pero con observaciones. Repase los capítulos con menos estrellas antes de la próxima sesión.";
  portadaVacia();
  dialogo([["C","Cierre del ciclo de capacitación. El Comité revisó las carpetas de los cinco casos de convivencia laboral atendidos."],["BS","Obtuvieron "+est+" de 15 estrellas posibles y "+nh+" de "+HOJAS.length+" fichas de la guía recuperadas."],["C",nota],["R","Gracias, {n}. Ahora conoce el rol preventivo y conciliador del Comité de Convivencia Laboral y cómo cuidar el bienestar de toda la comunidad Uniempresarial."]],portada);
}

  const mal=HOJAS.filter(h=>S.hojas[h.a]===0).map(h=>li("↻",`<b>${esc(h.rot||"Art. "+h.a)} · ${esc(h.t)}.</b> ${esc(h.txt)}`)).join("");
  hoja(`<button class="mini cerrar" data-x>Cerrar</button><span class="eti">Cierre de la capacitación</span><h2>Lo que aprendí hoy</h2>
   <p class="nota">${Object.keys(S.best).length}/${MIS.length} casos · ${Object.values(S.hojas).filter(v=>v>0).length}/${HOJAS.length} preguntas bien · ${totalRk()} pts</p>
   ${casos?`<span class="eti">Reglas de los casos que resolvió</span><ul class="lista">${casos}</ul>`:`<p>Aún no ha resuelto ningún caso. Elija un capítulo para empezar.</p>`}
   ${mal?`<span class="eti">Para repasar</span><ul class="lista">${mal}</ul>`:""}${bien?`<span class="eti">Artículos que ya domina</span><ul class="lista">${bien}</ul>`:""}<button class="btn" data-x>Entendido</button>`)}

/* ---------- Registro de participantes ---------- */
let DB=null,UID=null,unsub=null,ultPub=0,colaPub=0,ultFirma="";
const listo=(async()=>{try{if(!window.claude||!window.claude.use)return false;
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(!db||!user)return false;const id=await user.id();if(!id)return false;DB=db;UID=id;return true}catch(e){return false}})();
function totalRk(){return Object.values(S.best).reduce((a,b)=>a+b,0)+puntosHojas()}
function miPid(){let id=leer("ccl_pid");if(!id){id="p_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);guardar("ccl_pid",id)}return id}
function fechaIngreso(){let f=leer("ccl_ingreso");if(!f){f=new Date().toISOString();guardar("ccl_ingreso",f)}return f}
function conTiempo(p,ms){let t;const lim=new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error("timeout")),ms)});return Promise.race([p,lim]).finally(()=>clearTimeout(t))}
function publicar(){
  const al=((S.look&&S.look.nombre)||leer("ccl_alias")||"Colaborador").trim().slice(0,40)||"Colaborador",tot=totalRk(),casos=Object.keys(S.best).length,hojas=Object.keys(S.hojas).length;
  const firma=JSON.stringify([al,tot,casos,hojas]);
  if(firma===ultFirma)return;
  const esp=5000-(Date.now()-ultPub);
  if(esp>0){if(!colaPub)colaPub=setTimeout(()=>{colaPub=0;publicar()},esp);return}
  ultPub=Date.now();ultFirma=firma;
  enviarRegistro(al,tot,casos,hojas);
}
async function enviarRegistro(al,tot,casos,hojas){
  const ahora=new Date().toISOString(),ing=fechaIngreso();
  if(await listo){
    try{const ref=DB.doc("ranking_ccl/"+UID),s=await conTiempo(ref.get(),10000),p=s.exists?(s.data()||{}):{},pIng=p.ingreso||ing;
      if(!s.exists||tot>(+p.puntos||0)||casos>(+p.casos||0)||hojas>(+p.hojas||0)||p.alias!==al||!p.ingreso){
        await conTiempo(ref.set({alias:al,puntos:Math.max(tot,+p.puntos||0),casos:Math.max(casos,+p.casos||0),hojas:Math.max(hojas,+p.hojas||0),fecha:Date.now(),ingreso:pIng,ultima:ahora}),10000)}}catch(e){ultFirma=""}
    return;
  }
  if(!REGISTRO_URL)return;
  try{
    await conTiempo(fetch(REGISTRO_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({id:miPid(),alias:al,puntos:tot,casos:casos,hojas:hojas,ingreso:ing,ultima:ahora})}),10000);
  }catch(e){ultFirma=""}
}
function pintarRegistro(lista,esYo){
  const n2=document.getElementById("rkn"),l2=document.getElementById("rkl");if(!n2||!l2)return;
  const ord=[...lista].sort((a,b)=>(+b.puntos||0)-(+a.puntos||0)),totalPart=ord.length;
  n2.textContent=totalPart===0?"0 participantes registrados. Entre a la sede o avance en un capítulo para aparecer.":(totalPart===1?"1 participante registrado":"Participantes registrados: "+totalPart)+" · Ordenado por puntos.";
  l2.innerHTML="";
  let yaYo=false;
  ord.slice(0,50).forEach(x=>{
    const li=document.createElement("li");
    if(!yaYo&&esYo(x)){li.className="yo";yaYo=true}
    const a=document.createElement("span");a.textContent=String(x.alias||"Anónimo").slice(0,40);
    const b=document.createElement("b");b.textContent=(+x.puntos||0)+" pts · casos "+(+x.casos||0)+"/"+MIS.length+" · hojas "+(+x.hojas||0)+"/"+HOJAS.length;
    li.append(a,b);l2.append(li);
  });
}
async function verRanking(){
  const n=document.getElementById("rkn");if(!n)return;
  const t=setTimeout(()=>{const x=document.getElementById("rkn");if(x&&x.textContent.startsWith("Conectando"))x.textContent=sinRk()},10000);
  if(await listo){
    if(unsub)unsub();
    unsub=DB.collection("ranking_ccl").orderBy("puntos","desc").limit(50).onSnapshot(q=>{clearTimeout(t);
      const filas=q.docs.map(d=>Object.assign({id:d.id},d.data()||{}));
      pintarRegistro(filas,x=>x.id===UID)},
    ()=>{clearTimeout(t);const n2=document.getElementById("rkn");if(n2)n2.textContent=sinRk()});
    return;
  }
  if(REGISTRO_URL){
    try{
      const r=await conTiempo(fetch(REGISTRO_URL+"?accion=lista",{cache:"no-store"}),10000);if(!r.ok)throw new Error("http "+r.status);
      const datos=await conTiempo(r.json(),10000);
      clearTimeout(t);
      if(!Array.isArray(datos))throw new Error("Formato inválido");
      const miAl=((S.look&&S.look.nombre)||leer("ccl_alias")||"").trim(),miIng=leer("ccl_ingreso")||"";
      const hayIng=Boolean(miIng&&datos.some(x=>x&&String(x.ingreso||"")===miIng));
      pintarRegistro(datos,x=>Boolean(x)&&(hayIng?String(x.ingreso||"")===miIng:(Boolean(miAl)&&String(x.alias||"")===miAl)));
      return;
    }catch(e){}
  }
  clearTimeout(t);const x=document.getElementById("rkn"),l2=document.getElementById("rkl");if(x)x.textContent=sinRk();if(l2)l2.innerHTML="";
}
function sinRk(){return "El registro compartido se activa en el enlace oficial del juego. Su total en este equipo: "+totalRk()+" pts."}

HOJAS.forEach(h=>{if(!pisable(h.tile[0],h.tile[1])||Object.values(SALAS).some(s=>s.spot+""===h.tile+""||s.door+""===h.tile+""))console.warn("Hoja mal ubicada",h.a)});
imgUE.onload=()=>{fondo=null;S.pintado=false};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fondo=null;S.pintado=false});
portada();
})();
</script>
